version: '3.8'

services:
  # Validator node
  validator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myblockchain-validator
    volumes:
      - validator-data:/home/myblockchain/.myblockchain
      - ./genesis:/genesis:ro  # Mount genesis files
    ports:
      - "26656:26656"  # P2P
      - "26657:26657"  # RPC
      - "1317:1317"    # REST API
      - "9090:9090"    # gRPC
    environment:
      - CHAIN_ID=theta-testnet-001
      - MONIKER=my-testnet-validator
    restart: unless-stopped
    networks:
      - myblockchain

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: myblockchain-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9000:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - myblockchain
    depends_on:
      - validator

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: myblockchain-grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-worldmap-panel
    networks:
      - myblockchain
    depends_on:
      - prometheus

volumes:
  validator-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  myblockchain:
    driver: bridge
